name: Release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build twine packaging
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Validate tag and distributions
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_release.py
      - name: Smoke test built wheel
        run: |
          python -m pip install dist/*.whl
          zsm version
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: distributions
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* "${args[@]}"
